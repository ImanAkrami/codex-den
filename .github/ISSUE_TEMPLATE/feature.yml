name: Feature proposal
description: Explain a workflow that Codex Den should support
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include the simplest useful workflow, alternatives, and any impact on shared environments.
    validations:
      required: true
