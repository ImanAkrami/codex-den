name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.12'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: sh -n install.sh
      - run: sh -n scripts/install-source.sh
      - run: uv sync --frozen
      - run: uv run python scripts/check.py
      - run: uv build
  native:
    uses: ./.github/workflows/native.yml
