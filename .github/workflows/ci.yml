name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.12'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: sh -n install.sh
      - run: sh -n scripts/install-source.sh
      - run: uv sync --frozen
      - run: uv run python scripts/check.py
      - run: uv build
  native:
    uses: ./.github/workflows/native.yml
