name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0a1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ inputs.tag }}
  draft:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.12'
          python-version: '3.12'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/prepare_release.py "$RELEASE_TAG"
      - run: uv sync --frozen
      - run: uv run python scripts/check.py
      - run: uv build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Prepare artifacts and draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/prepare_release.py "$RELEASE_TAG" --artifacts dist
          set -- --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          case "$RELEASE_TAG" in
            *a*|*b*|*rc*) set -- "$@" --prerelease ;;
          esac
          gh release create "$RELEASE_TAG" dist/* "$@"
