[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-den"
version = "0.1.0a1"
description = "Named and shared Codex extension environments for VS Code and Cursor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Codex Den contributors"}]
keywords = ["codex", "vscode", "cursor", "workspace", "cli", "tui"]
requires-python = ">=3.12"
dependencies = ["textual>=6,<7", "tomli-w>=1.2,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/ImanAkrami/codex-den"
Repository = "https://github.com/ImanAkrami/codex-den"
Documentation = "https://github.com/ImanAkrami/codex-den/blob/main/docs/quick-start.md"
Issues = "https://github.com/ImanAkrami/codex-den/issues"
Changelog = "https://github.com/ImanAkrami/codex-den/blob/main/CHANGELOG.md"

[project.scripts]
codex-den = "codex_den.cli:main"

[dependency-groups]
binary = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "hypothesis>=6,<7", "pexpect>=4.9,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_den"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/codex_den", "scripts", "tests", "docs", ".github",
  "README.md", "LICENSE", "THIRD_PARTY.md", "CHANGELOG.md",
  "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "AGENTS.md",
  "install.sh", "pyproject.toml", "uv.lock", ".gitignore", ".gitattributes", ".editorconfig",
]
exclude = ["__pycache__", "*.py[cod]", ".env", ".env.*", "*.pem", "*.key"]

[tool.coverage.run]
source = ["codex_den"]
patch = ["subprocess"]
parallel = true
